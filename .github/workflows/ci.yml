name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # Needs a runner with Xcode 26 (macOS 26 SDK).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Build (direct)
        run: swift build
      - name: Build (App Store configuration)
        run: swift build -Xswiftc -DAPP_STORE --build-path .build-appstore
      - name: Test
        run: swift test
