# XcodeGen spec for the signed builds. Generate the project with:  xcodegen generate
# (DiskLens.xcodeproj is generated, not committed.) Day-to-day development can keep using SwiftPM.
name: DiskLens
options:
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: zh-Hant
  createIntermediateGroups: true

packages:
  DiskLensKit:
    path: .

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Set your Team ID here or pick the team in Xcode › Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_FILE: Packaging/Info.plist
    PRODUCT_NAME: DiskLens
    PRODUCT_BUNDLE_IDENTIFIER: tw.ncse.disklens
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targetTemplates:
  DiskLensApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/DiskLens
      - path: Packaging/Assets.xcassets
      - path: Packaging/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: DiskLensKit
        product: DiskLensCore

targets:
  # Direct download (Developer ID + notarization). Not sandboxed: can launch local AI CLIs.
  DiskLens:
    templates: [DiskLensApp]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Packaging/DiskLens.entitlements

  # Mac App Store. Sandboxed; AI uses Apple's on-device model only (APP_STORE compiles out the CLIs).
  DiskLens-AppStore:
    templates: [DiskLensApp]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Packaging/DiskLensAppStore.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"

schemes:
  DiskLens:
    build:
      targets:
        DiskLens: all
    run:
      config: Debug
    archive:
      config: Release
  DiskLens-AppStore:
    build:
      targets:
        DiskLens-AppStore: all
    run:
      config: Debug
    archive:
      config: Release
