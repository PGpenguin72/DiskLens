# XcodeGen spec for the signed builds. Generate the project with:  xcodegen generate
# (Ringwise.xcodeproj is generated, not committed.) Day-to-day development can keep using SwiftPM.
name: Ringwise
options:
  deploymentTarget:
    macOS: "26.0"
  # Source language of Localizable.xcstrings. XcodeGen fills knownRegions (zh-Hant, zh-Hans, en, Base)
  # from the languages in the catalog; Packaging/Info.plist lists them in CFBundleLocalizations.
  developmentLanguage: zh-Hant
  createIntermediateGroups: true

packages:
  RingwiseKit:
    path: .

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Set your Team ID here or pick the team in Xcode › Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_FILE: Packaging/Info.plist
    PRODUCT_NAME: Ringwise
    PRODUCT_BUNDLE_IDENTIFIER: tw.pg72.ringwise
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targetTemplates:
  RingwiseApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/Ringwise
      - path: Packaging/Assets.xcassets
      - path: Packaging/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: RingwiseKit
        product: RingwiseCore

targets:
  # Direct download (Developer ID + notarization). Not sandboxed: can launch local AI CLIs.
  Ringwise:
    templates: [RingwiseApp]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Packaging/Ringwise.entitlements

  # Mac App Store. Sandboxed; AI uses Apple's on-device model only (APP_STORE compiles out the CLIs).
  Ringwise-AppStore:
    templates: [RingwiseApp]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Packaging/RingwiseAppStore.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"

schemes:
  Ringwise:
    build:
      targets:
        Ringwise: all
    run:
      config: Debug
    archive:
      config: Release
  Ringwise-AppStore:
    build:
      targets:
        Ringwise-AppStore: all
    run:
      config: Debug
    archive:
      config: Release
